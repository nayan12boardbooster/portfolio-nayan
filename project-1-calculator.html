<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator Project | Nayan Gupta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(15, 23, 42, 0.8);
      --panel-border: rgba(0, 240, 255, 0.18);
      --cyan: #00f0ff;
      --purple: #9d4edd;
      --border: rgba(148, 163, 184, 0.22);
      --text: #f8fafc;
      --muted: #94a3b8;
      --button: #0f172a;
      --button-strong: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, rgba(0, 240, 255, 0.12), transparent 35%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .app-shell {
      width: min(100%, 460px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.12);
      padding: 22px;
      backdrop-filter: blur(16px);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .brand {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--cyan);
      text-transform: uppercase;
    }
    .back-link {
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.7);
    }
    .display {
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid var(--border);
      border-radius: 18px;
      height: 110px;
      display: flex;
      align-items: end;
      justify-content: flex-end;
      padding: 18px 18px 14px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 700;
      overflow: hidden;
      word-break: break-all;
      margin-bottom: 16px;
      font-family: 'Fira Code', monospace;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.6));
      color: var(--text);
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      min-height: 64px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    button:hover {
      transform: translateY(-1px);
      border-color: rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.08);
    }
    .operator, .equals {
      background: linear-gradient(180deg, rgba(157, 77, 221, 0.2), rgba(15, 23, 42, 0.8));
      color: #e9d5ff;
    }
    .clear { background: linear-gradient(180deg, rgba(0, 240, 255, 0.12), rgba(15, 23, 42, 0.8)); color: var(--cyan); }
    .equals {
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.18), rgba(15, 23, 42, 0.8));
      color: #d1fae5;
    }
    .span-2 { grid-column: span 2; }
    @media (max-width: 480px) {
      .app-shell { padding: 16px; }
      .buttons { gap: 10px; }
      button { min-height: 58px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand">Calc // v1</div>
      <a href="Nayan-Portfolio.html" class="back-link">Back</a>
    </div>

    <div id="display" class="display">0</div>

    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button class="clear" data-action="del">DEL</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="equals span-2" data-action="equals">=</button>

      <button class="span-2" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="operator" data-value="%">%</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let expression = '';

    function renderDisplay(value) {
      display.textContent = value || '0';
    }

    function appendValue(value) {
      if (value === '.' && expression.endsWith('.')) return;
      if (['+', '-', '*', '/', '%'].includes(value) && !expression) return;
      if (['+', '-', '*', '/', '%'].includes(value) && ['+', '-', '*', '/', '%'].includes(expression.slice(-1))) return;
      expression += value;
      renderDisplay(expression);
    }

    function clearAll() {
      expression = '';
      renderDisplay('0');
    }

    function deleteLast() {
      expression = expression.slice(0, -1);
      renderDisplay(expression || '0');
    }

    function calculate() {
      if (!expression) return;
      try {
        const result = Function(`"use strict"; return (${expression.replace(/%/g, '/100')})`)();
        expression = String(result);
        renderDisplay(expression);
      } catch (error) {
        expression = '';
        renderDisplay('Error');
        setTimeout(() => renderDisplay('0'), 800);
      }
    }

    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        const value = button.dataset.value;

        if (action === 'clear') clearAll();
        else if (action === 'del') deleteLast();
        else if (action === 'equals') calculate();
        else if (value) appendValue(value);
      });
    });

    document.addEventListener('keydown', (e) => {
      const key = e.key;
      if (/^[0-9]$/.test(key) || ['+', '-', '*', '/', '.'].includes(key)) appendValue(key);
      if (key === 'Enter') calculate();
      if (key === 'Backspace') deleteLast();
      if (key === 'Escape') clearAll();
    });
  </script>
</body>
</html>

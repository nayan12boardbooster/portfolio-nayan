<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Light Toggle App | Nayan Gupta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(15, 23, 42, 0.8);
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #00f0ff;
      --amber: #fbbf24;
      --yellow: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, sans-serif;
      background: radial-gradient(circle at top, rgba(251, 191, 36, 0.12), transparent 38%), var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .room {
      position: relative;
      width: min(100%, 520px);
      height: 520px;
      border-radius: 32px;
      overflow: hidden;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      border: 1px solid rgba(251, 191, 36, 0.22);
      box-shadow: 0 0 36px rgba(251, 191, 36, 0.08);
      transition: all 0.4s ease;
    }
    .room.light-on {
      background: linear-gradient(180deg, #fef9c3 0%, #f5d0fe 100%);
    }
    .wall {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
    }
    .bulb-wrap {
      position: absolute;
      left: 50%;
      top: 78px;
      transform: translateX(-50%);
      width: 130px;
      height: 130px;
      display: grid;
      place-items: center;
    }
    .bulb {
      width: 94px;
      height: 94px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      border: 4px solid rgba(255,255,255,0.2);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.25);
      transition: all 0.35s ease;
      position: relative;
    }
    .bulb::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      box-shadow: 0 0 14px rgba(255,255,255,0.3);
    }
    .room.light-on .bulb {
      background: rgba(251, 191, 36, 0.95);
      box-shadow: 0 0 60px rgba(251, 191, 36, 0.9), inset 0 0 18px rgba(255,255,255,0.45);
      border-color: rgba(255,255,255,0.8);
    }
    .stand {
      position: absolute;
      left: 50%;
      top: 200px;
      transform: translateX(-50%);
      width: 98px;
      height: 185px;
      border-radius: 12px;
      background: linear-gradient(180deg, #64748b 0%, #334155 100%);
      border: 2px solid rgba(15, 23, 42, 0.3);
    }
    .stand::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -18px;
      width: 130px;
      height: 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.25);
    }
    .switch-panel {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .switch {
      width: 160px;
      height: 64px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      position: relative;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .switch::before {
      content: "";
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      top: 6px;
      left: 8px;
      background: linear-gradient(135deg, #f8fafc, #cbd5e1);
      transition: all 0.25s ease;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.25);
    }
    .room.light-on .switch {
      background: rgba(250, 204, 21, 0.25);
      border-color: rgba(250, 204, 21, 0.45);
    }
    .room.light-on .switch::before {
      left: 100px;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
    }
    .status-text {
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .room.light-on .status-text {
      color: #78350f;
    }
    .back-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255,255,255,0.18);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      text-decoration: none;
      z-index: 10;
    }
    @media (max-width: 560px) {
      .room { height: 480px; }
      .switch { width: 140px; }
      .room.light-on .switch::before { left: 80px; }
    }
  </style>
</head>
<body>
  <div class="room" id="room">
    <a href="Nayan-Portfolio.html" class="back-btn">Back</a>
    <div class="wall"></div>
    <div class="bulb-wrap"><div class="bulb"></div></div>
    <div class="stand"></div>
    <div class="switch-panel">
      <div class="switch" id="switch" aria-label="Toggle light"></div>
      <div class="status-text" id="status-text">Light Off</div>
    </div>
  </div>

  <script>
    const room = document.getElementById('room');
    const statusText = document.getElementById('status-text');
    const switchBtn = document.getElementById('switch');
    let isOn = false;

    function updateRoom() {
      room.classList.toggle('light-on', isOn);
      statusText.textContent = isOn ? 'Light On' : 'Light Off';
    }

    switchBtn.addEventListener('click', () => {
      isOn = !isOn;
      updateRoom();
    });
  </script>
</body>
</html>

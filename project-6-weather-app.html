<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App | Nayan Gupta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(15, 23, 42, 0.8);
      --cyan: #00f0ff;
      --purple: #9d4edd;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, sans-serif;
      background: radial-gradient(circle at top, rgba(0, 240, 255, 0.12), transparent 40%), var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .weather-card {
      width: min(100%, 760px);
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.18);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.08);
      backdrop-filter: blur(12px);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .title {
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      margin: 0;
      font-weight: 900;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    input {
      border: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.7);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      min-width: min(100%, 220px);
    }
    button {
      border: none;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      color: #020617;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      margin-top: 16px;
    }
    .panel {
      background: rgba(2, 6, 23, 0.82);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
    }
    .temp {
      font-size: clamp(3rem, 6vw, 5rem);
      font-weight: 900;
      line-height: 1;
      margin: 10px 0;
    }
    .meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .icon {
      font-size: 4rem;
      margin: 8px 0;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .stat {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }
    .stat .label {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .stat strong {
      font-size: 1.5rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      text-decoration: none;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--line);
      color: var(--text);
      margin-top: 20px;
    }
    @media (max-width: 700px) {
      .hero { grid-template-columns: 1fr; }
      .weather-card { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="weather-card">
    <div class="topbar">
      <h1 class="title">Weather App</h1>
      <div class="search">
        <input id="cityInput" type="text" value="Delhi" aria-label="City name" />
        <button id="searchBtn">Search</button>
      </div>
    </div>

    <div class="hero">
      <div class="panel">
        <div id="location" class="label" style="font-size:0.8rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted);">Delhi, IN</div>
        <div class="icon" id="weatherIcon">☀️</div>
        <div id="temp" class="temp">28°</div>
        <div id="condition" style="font-size:1.1rem; font-weight:700; margin-bottom:10px;">Clear skies</div>
        <div class="meta">
          <span id="humidity">Humidity: 48%</span>
          <span id="wind">Wind: 11 km/h</span>
        </div>
      </div>

      <div class="panel">
        <div class="stats">
          <div class="stat">
            <div class="label">Feels like</div>
            <strong id="feels">30°</strong>
          </div>
          <div class="stat">
            <div class="label">High</div>
            <strong id="high">31°</strong>
          </div>
          <div class="stat">
            <div class="label">Low</div>
            <strong id="low">24°</strong>
          </div>
          <div class="stat">
            <div class="label">Rain</div>
            <strong id="rain">12%</strong>
          </div>
        </div>
      </div>
    </div>

    <a href="Nayan-Portfolio.html" class="back-link">Back to Portfolio</a>
  </div>

  <script>
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');

    const locationEl = document.getElementById('location');
    const tempEl = document.getElementById('temp');
    const conditionEl = document.getElementById('condition');
    const humidityEl = document.getElementById('humidity');
    const windEl = document.getElementById('wind');
    const feelsEl = document.getElementById('feels');
    const highEl = document.getElementById('high');
    const lowEl = document.getElementById('low');
    const rainEl = document.getElementById('rain');
    const weatherIcon = document.getElementById('weatherIcon');

    function weatherIconFromCode(code) {
      if (code === 0) return '☀️';
      if ([1,2,3].includes(code)) return '🌤️';
      if ([45,48].includes(code)) return '🌫️';
      if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
      if ([71,73,75,77,85,86].includes(code)) return '🌨️';
      if ([95,96,99].includes(code)) return '⛈️';
      return '☁️';
    }

    function updateWeather(data) {
      const current = data.current;
      const daily = data.daily;
      const cityName = data.city || 'Current Location';

      locationEl.textContent = `${cityName}, ${data.country || 'IN'}`;
      tempEl.textContent = `${Math.round(current.temperature_2m)}°`;
      conditionEl.textContent = data.label || 'Weather Update';
      humidityEl.textContent = `Humidity: ${current.relative_humidity_2m ?? 0}%`;
      windEl.textContent = `Wind: ${Math.round(current.wind_speed_10m ?? 0)} km/h`;
      feelsEl.textContent = `${Math.round(current.apparent_temperature ?? current.temperature_2m)}°`;
      highEl.textContent = `${Math.round(daily.temperature_2m_max?.[0] ?? current.temperature_2m)}°`;
      lowEl.textContent = `${Math.round(daily.temperature_2m_min?.[0] ?? current.temperature_2m)}°`;
      rainEl.textContent = `${Math.round(current.precipitation ?? 0)}%`;
      weatherIcon.textContent = weatherIconFromCode(current.weather_code);
    }

    async function loadWeather(cityName) {
      try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`);
        const geoData = await geoRes.json();
        if (!geoData.results || !geoData.results.length) {
          alert('City not found. Try another location.');
          return;
        }

        const place = geoData.results[0];
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
        const weatherData = await weatherRes.json();

        updateWeather({
          city: place.name,
          country: place.country,
          current: weatherData.current,
          daily: weatherData.daily,
          label: 'Current Weather'
        });
      } catch (error) {
        alert('Weather service is unavailable right now. Please try again later.');
      }
    }

    searchBtn.addEventListener('click', () => {
      loadWeather(cityInput.value.trim() || 'Delhi');
    });

    cityInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') loadWeather(cityInput.value.trim() || 'Delhi');
    });

    loadWeather('Delhi');
  </script>
</body>
</html>
